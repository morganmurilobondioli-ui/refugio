<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test App Refugio</title>
    <link rel="stylesheet" href="css/vendors.min.css"/>
    <link rel="stylesheet" href="css/icon.min.css"/>
</head>
<body class="p-5">
    <h1>Test de Funciones</h1>
    
    <div class="mb-3">
        <button onclick="showAlert('Esto es un éxito', 'success')" class="btn btn-success">Success Alert</button>
        <button onclick="showAlert('Esto es un error', 'error')" class="btn btn-danger">Error Alert</button>
        <button onclick="showAlert('Esto es una advertencia', 'warning')" class="btn btn-warning">Warning Alert</button>
        <button onclick="showAlert('Esto es info', 'info')" class="btn btn-info">Info Alert</button>
    </div>
    
    <div class="mb-3">
        <button onclick="showConfirm('¿Estás seguro?', () => alert('Confirmado'), () => alert('Cancelado'))" class="btn btn-primary">
            Show Confirm
        </button>
    </div>
    
    <div class="mb-3">
        <button onclick="testFetch()" class="btn btn-secondary">Test Fetch API</button>
    </div>
    
    <script src="js/jquery.js"></script>
    <script src="js/vendors.min.js"></script>
    <script src="js/app.refugio.js"></script>
    <script>
        async function testFetch() {
            try {
                const data = await fetchAPI('/api/animales');
                console.log('Datos recibidos:', data);
                showAlert(`Se obtuvieron ${data.total} animales`, 'success');
            } catch (error) {
                showAlert(error.message, 'error');
            }
        }
    </script>
</body>
</html>
