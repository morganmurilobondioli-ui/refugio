<!doctype html>
<html class="no-js" lang="es">
<head>
    <title>Animales - Refugio Don Pepito</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    
    <!-- favicon -->
    <link rel="shortcut icon" href="../public/images/favicon.png">
    
    <!-- styles -->
    <link rel="stylesheet" href="css/vendors.min.css"/>
    <link rel="stylesheet" href="css/icon.min.css"/>
    <link rel="stylesheet" href="css/style.css"/>
    <link rel="stylesheet" href="css/responsive.css"/>
    <link rel="stylesheet" href="demos/elder-care/elder-care.css"/>
    <link rel="stylesheet" href="css/refugio-custom.css"/>
</head>
<body data-mobile-nav-style="classic">
    
    <!-- start header -->
    <header> 
        <nav class="navbar navbar-expand-lg header-light bg-white sticky-top box-shadow-small">
            <div class="container-fluid">
                <div class="col-auto me-auto">
                    <a class="navbar-brand" href="../index.html">
                        <img src="../images/refugio-logo.png" alt="Refugio Don Pepito" class="default-logo" style="max-height: 50px;">
                    </a>
                </div>
                <div class="col-auto menu-order">
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                        <span class="navbar-toggler-line"></span>
                        <span class="navbar-toggler-line"></span>
                        <span class="navbar-toggler-line"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarNav"> 
                        <ul class="navbar-nav"> 
                            <li class="nav-item"><a href="index.html" class="nav-link">Dashboard</a></li>
                            <li class="nav-item"><a href="animales.html" class="nav-link active">Animales</a></li>
                            <li class="nav-item"><a href="responsable.html" class="nav-link">Responsables</a></li>
                            <li class="nav-item"><a href="duenio.html" class="nav-link">Dueños</a></li>
                            <li class="nav-item"><a href="adopcion.html" class="nav-link">Adopciones</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    <!-- end header -->

    <!-- start page title -->
    <section class="page-title-big-typography bg-gradient-blue-transparent-first ipad-top-space-margin" data-parallax-background-ratio="0.5">
        <div class="container">
            <div class="row align-items-center justify-content-center extra-small-screen">
                <div class="col-12 text-center">
                    <h1 class="alt-font text-dark-gray fw-700 ls-minus-2px mb-20px">
                        <i class="bi bi-heart-fill text-base-color me-10px"></i>
                        Nuestros Animales
                    </h1>
                    <p class="fs-19 mb-0">Conoce a todos los animales del refugio</p>
                </div>
            </div>
        </div>
    </section>
    <!-- end page title -->

    <!-- start gallery section -->
    <section class="pt-5 pb-5">
        <div class="container">
            
            <!-- Barra de acciones -->
            <div class="row mb-4">
                <div class="col-lg-8 col-md-7 mb-3 mb-md-0">
                    <!-- Búsqueda -->
                    <div class="position-relative">
                        <input type="text" 
                               id="searchInput" 
                               class="form-control ps-50px h-60px border-radius-6px" 
                               placeholder="Buscar por nombre, raza o descripción...">
                        <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-20px text-muted fs-18"></i>
                    </div>
                </div>
                <div class="col-lg-4 col-md-5 text-end">
                    <a href="crear.html" class="btn btn-large btn-base-color btn-rounded btn-box-shadow w-100 h-60px d-flex align-items-center justify-content-center">
                        <i class="bi bi-plus-circle me-10px"></i>Registrar Animal
                    </a>
                </div>
            </div>

            <!-- Filtros -->
            <div class="row mb-4">
                <div class="col-12">
                    <div class="bg-white border-radius-6px box-shadow-large p-30px">
                        <div class="row align-items-center">
                            <div class="col-lg-3 col-md-6 mb-3 mb-lg-0">
                                <label class="form-label fw-600 text-dark-gray mb-10px">Estado</label>
                                <select id="filterEstado" class="form-select h-50px">
                                    <option value="">Todos</option>
                                    <option value="disponible">Disponibles</option>
                                    <option value="adoptado">Adoptados</option>
                                    <option value="en_proceso">En Proceso</option>
                                </select>
                            </div>
                            <div class="col-lg-3 col-md-6 mb-3 mb-lg-0">
                                <label class="form-label fw-600 text-dark-gray mb-10px">Ordenar por</label>
                                <select id="sortBy" class="form-select h-50px">
                                    <option value="fecha_desc">Más recientes</option>
                                    <option value="fecha_asc">Más antiguos</option>
                                    <option value="nombre_asc">Nombre A-Z</option>
                                    <option value="nombre_desc">Nombre Z-A</option>
                                </select>
                            </div>
                            <div class="col-lg-3 col-md-6 mb-3 mb-lg-0">
                                <label class="form-label fw-600 text-dark-gray mb-10px">Vista</label>
                                <div class="btn-group w-100 h-50px" role="group">
                                    <button type="button" class="btn btn-outline-secondary active" id="viewGrid">
                                        <i class="bi bi-grid-3x3-gap"></i>
                                    </button>
                                    <button type="button" class="btn btn-outline-secondary" id="viewList">
                                        <i class="bi bi-list-ul"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="col-lg-3 col-md-6">
                                <label class="form-label fw-600 text-dark-gray mb-10px">&nbsp;</label>
                                <button id="btnResetFilters" class="btn btn-outline-dark w-100 h-50px">
                                    <i class="bi bi-arrow-clockwise me-5px"></i>Limpiar filtros
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Contador de resultados -->
            <div class="row mb-3">
                <div class="col-12">
                    <div class="d-flex justify-content-between align-items-center">
                        <p class="mb-0 text-dark-gray fw-600">
                            <span id="totalAnimales">0</span> animales encontrados
                        </p>
                        <div id="loadingIndicator" class="d-none">
                            <div class="spinner-border spinner-border-sm text-primary" role="status">
                                <span class="visually-hidden">Cargando...</span>
                            </div>
                            <span class="ms-2 text-muted">Cargando...</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Grid de animales -->
            <div class="row" id="animalesContainer">
                <!-- Se llenará dinámicamente con JavaScript -->
            </div>

            <!-- Paginación (opcional para futuro) -->
            <div class="row mt-5">
                <div class="col-12">
                    <nav aria-label="Paginación" id="paginationContainer" class="d-none">
                        <ul class="pagination justify-content-center">
                            <!-- Paginación dinámica -->
                        </ul>
                    </nav>
                </div>
            </div>

        </div>
    </section>
    <!-- end gallery section -->

    <!-- start footer -->
    <footer class="pt-40px pb-40px bg-dark-gray">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6 text-center text-md-start">
                    <span class="text-white">&copy; 2025 Refugio Don Pepito</span>
                </div>
                <div class="col-md-6 text-center text-md-end">
                    <span class="text-white">Sistema de Gestión de Adopciones</span>
                </div>
            </div>
        </div>
    </footer>
    <!-- end footer -->

    <!-- Modal de detalle del animal -->
    <div class="modal fade" id="modalDetalleAnimal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-radius-8px">
                <div class="modal-header border-bottom-0">
                    <h5 class="modal-title fw-700 text-dark-gray" id="modalAnimalNombre">Detalle del Animal</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalAnimalBody">
                    <!-- Se llenará dinámicamente -->
                </div>
            </div>
        </div>
    </div>

    <!-- scripts -->
    <script src="../js/jquery.js"></script>
    <script src="../js/vendors.min.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/app.refugio.js"></script>
    <script src="../js/animales.js"></script>
</body>
</html>
